name: Branch Protection

on:
  push:
    branches:
      - main
      - develop

jobs:
  protect:
    name: Enforce Branch Protection
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          if [[ "\$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "Cannot push directly to main"
            exit 1
          fi
