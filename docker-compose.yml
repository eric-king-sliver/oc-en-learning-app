version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ela-postgres
    environment:
      POSTGRES_USER: english_learning
      POSTGRES_PASSWORD: english_learning_dev
      POSTGRES_DB: english_learning_dev
    ports:
      - "5432:5432"
    volumes:
      - .postgres/data:/var/lib/postgresql/data
      - ./docs/database-schema.md:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ela-redis
    ports:
      - "6379:6379"
    volumes:
      - .redis/data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ela-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: english_learning
      MINIO_ROOT_PASSWORD: english_learning_dev_secret
    volumes:
      - .minio/data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Optional: Mailhog for local email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ela-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
